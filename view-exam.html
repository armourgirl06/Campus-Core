<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Exam Schedules</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(-45deg, #0f2027, #61afc9, #92c3d8, #0f2027);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 30px;
    }

    #fileList {
      width: 90%;
      max-width: 700px;
    }

    .entry {
      background: #ffffff;
      border-left: 6px solid #61afc9;
      padding: 16px 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .entry:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
    }

    .entry a {
      text-decoration: none;
      font-weight: bold;
      color: #0f2027;
      font-size: 1.1em;
      word-break: break-word;
    }

    .entry a:hover {
      color: #0077a6;
    }

    .timestamp {
      font-size: 0.85em;
      color: #555;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h2>Exam Schedules</h2>
  <div id="fileList"></div>

  <script>
    const key = "examFiles";
    const list = document.getElementById("fileList");

    function loadFiles() {
      const data = JSON.parse(localStorage.getItem(key)) || [];
      list.innerHTML = '';
      data.reverse().forEach(entry => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
          <a href="${entry.url}" download="${entry.name}">${entry.name}</a>
          <div class="timestamp">${entry.time}</div>
        `;
        list.appendChild(div);
      });
    }

    window.onload = loadFiles;
  </script>
</body>
</html>
