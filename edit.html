<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Portal</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 20px;
      background: linear-gradient(-45deg, #0f2027, #5a90a2, #5088a0, #0f2027);
    }
    .card {
      width: 150px;
      height: 150px;
      background: linear-gradient(-45deg, #208484, #f9fafa, #f9fafa);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: black;
    }
    .card img {
      width: 50px;
      height: 50px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <a class="card" href="notice.html">
    <img src="notice - file.png" alt="Notice" />
    <div>Notice</div>
  </a>
  <a class="card" href="timetable.html">
    <img src="TimeTable - file.png" alt="Timetable" />
    <div>Timetable</div>
  </a>
  <a class="card" href="exam.html">
    <img src="examschedule.png" alt="Exam" />
    <div>Exam Schedule</div>
  </a>
  <a class="card" href="event.html">
    <img src="event.png" alt="Event" />
    <div>Event</div>
  </a>
  <a class="card" href="complaints.html">
    <img src="complaint - file.png" alt="Complaints" />
    <div>Student's complaints </div>
  </a>
</body>
</html>
