<!DOCTYPE html>
  <html>
  <head>
    <title>Student Login</title>
    <style>
      body { font-family: Arial; padding: 20px; background: #f8f8f8; }
      form { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
      input, button { width: 100%; padding: 10px; margin: 10px 0; }
      button { background: blue; color: white; border: none; border-radius: 5px; }
    </style>
  </head>
  <body>
  
  <h2 STYLE="text-align: center;"">STUDENT LOG IN</h2>
  <form id="loginForm">
    <input type="text" id="loginStudentId" placeholder="Student ID" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
   <button type="submit">Log In</button>
  </form>
  
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
  
      const studentId = document.getElementById("loginStudentId").value.trim();
      const password = document.getElementById("loginPassword").value;
  
      const users = JSON.parse(localStorage.getItem("students")) || [];
  
      const match = users.find(user => user.studentId === studentId && user.password === password);
  
      if (match) {
        alert("Login successful! Welcome " + studentId);
        window.location.href = "community.html";
        // You can redirect to a dashboard here if needed
      } else {
        alert("Invalid Student ID or Password.");
      }
    });
  </script>
  </body>
  </html>
