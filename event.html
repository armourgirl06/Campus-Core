<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Event</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: linear-gradient(-45deg, #0f2027, #5a90a2, #5088a0, #0f2027);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 20px;
    }

    h2 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
    }

    textarea {
      width: 60%;
      height: 100px;
      padding: 12px;
      border-radius: 5px;
      border: none;
      font-size: 1em;
      outline: none;
      background: #f1f1f1;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    button {
      padding: 12px 24px;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s, transform 0.3s;
    }

    button:hover {
      background: #1976d2;
      transform: scale(1.05);
    }

    .entry {
      background: #ffffff;
      border-left: 5px solid #2196f3;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      width: 60%;
      max-width: 600px;
    }

    .timestamp {
      font-size: 0.8em;
      color: gray;
    }

    .delete-btn {
      background: #e74c3c;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
      transition: background 0.3s;
    }

    .delete-btn:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>

  <h2>Post Event</h2>
  
  <!-- Textarea to enter event details -->
  <textarea id="eventText" placeholder="Enter event details..."></textarea><br />
  
  <!-- Post event button -->
  <button onclick="addEntry()">Post Event</button>

  <!-- Event list display -->
  <div id="eventList"></div>

  <script>
    const key = "eventEntries";
    const list = document.getElementById("eventList");

    // Function to load events from local storage
    function loadEntries() {
      const data = JSON.parse(localStorage.getItem(key)) || [];
      list.innerHTML = '';
      data.forEach((entry, index) => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
          <div>${entry.text}</div>
          <div class="timestamp">${entry.time}</div>
          <button class="delete-btn" onclick="deleteEntry(${index})">Delete</button>
        `;
        list.prepend(div);
      });
    }

    // Function to add a new event entry
    function addEntry() {
      const text = document.getElementById("eventText").value.trim();
      if (!text) return;
      const time = new Date().toLocaleString();
      const entry = { text, time };
      const existing = JSON.parse(localStorage.getItem(key)) || [];
      existing.push(entry);
      localStorage.setItem(key, JSON.stringify(existing));
      document.getElementById("eventText").value = '';
      loadEntries();
    }

    // Function to delete an event entry
    function deleteEntry(index) {
      const data = JSON.parse(localStorage.getItem(key)) || [];
      data.splice(index, 1);
      localStorage.setItem(key, JSON.stringify(data));
      loadEntries();
    }

    window.onload = loadEntries;
  </script>

</body>
</html>
