<!DOCTYPE html>
<html>
<head>
  <link rel = "stylesheet" href = "title.css">
  <meta charset="UTF-8">
  <title>Faculty Administration Sign Up</title>
  <style>
  
 
  </style>
</head>
<body>
  <h1 style="text-align: center;">FACULTY ADMINISTRATION SIGN UP</h1>
  <form id="signupForm">
    <input type="email" id="email" placeholder="Email" required>
    
    <label for="college">Select College:</label>
    <input list="colleges" id="collegeName" placeholder="Choose your college" required>
    <datalist id="colleges">
      <option value="Techno India Kolkata">
      <option value="Techno Main Salt Lake">
      <option value="Techno India">
      <option value="Techno University">
    </datalist>

    <input type="text" id="universityName" placeholder="University Name" required>
    <input type="password" id="password" placeholder="Password" required>
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

    <button type="submit">Sign Up</button>
  </form>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("signupForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const collegeName = document.getElementById("collegeName").value;
        const universityName = document.getElementById("universityName").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!email.includes("@")) {
          alert("Please enter a valid email address.");
          return;
        }

        if (password !== confirmPassword) {
          alert("Passwords do not match.");
          return;
        }

        const existingUsers = JSON.parse(localStorage.getItem("faculty administration")) || [];
        const alreadyExists = existingUsers.find(u => u.email === email);
        if (alreadyExists) {
          alert("Email already registered.");
          return;
        }

        // Save new user
        existingUsers.push({ email, password, collegeName, universityName });
        localStorage.setItem("faculty administration", JSON.stringify(existingUsers));


        window.location.href = "title2.html";
      });
    });
  </script>
</body>
</html>
