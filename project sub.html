<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 600px;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    label {
      font-weight: bold;
    }

    button {
      background-color: #5865f2;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    button:hover {
      background-color: #4752c4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Project Submission Form</h2>
    <form id="projectForm">
      <label for="studentId">Student ID:</label>
      <input type="text" id="studentId" name="studentId" required>

      <label for="name">Student Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="projectTitle">Project Title:</label>
      <input type="text" id="projectTitle" name="projectTitle" required>

      <label for="description">Project Description:</label>
      <textarea id="description" name="description" rows="4" required></textarea>

      <label for="category">Project Category:</label>
      <select id="category" name="category">
        <option value="web">Web Development</option>
        <option value="ai">AI / ML</option>
        <option value="iot">IoT</option>
        <option value="app">Mobile App</option>
        <option value="other">Other</option>
      </select>

      <label for="file">Upload Project File (PDF/ZIP):</label>
      <input type="file" id="file" name="file" accept=".pdf,.zip" required>

      <button type="submit">Submit Project</button>
    </form>
  </div>

  <script>
    document.getElementById('projectForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert("Project submitted successfully!");
      // Here you would normally send the form data to the backend server using fetch or AJAX
    });
  </script>
</body>
</html>
