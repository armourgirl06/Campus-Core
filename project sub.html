<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Submission</title>
  <style>
    :root {
      --primary-color: #5865f2;
      --primary-hover: #4752c4;
      --bg-color: #f4f6fc;
      --text-color: #333;
      --card-bg: #fff;
      --border-radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #eef1f8, #dbe3fa);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
      padding: 40px 20px;
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .container {
      max-width: 600px;
      background-color: var(--card-bg);
      padding: 40px 35px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      color: var(--primary-color);
      font-weight: bold;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      font-size: 15px;
    }

    input[type="text"],
    input[type="file"],
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background-color: #fafafa;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 6px rgba(88, 101, 242, 0.3);
      outline: none;
    }

    textarea {
      resize: vertical;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      transition: background-color 0.3s ease, transform 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Project Submission Form</h2>
    <form id="projectForm">
      <label for="studentId">Student ID:</label>
      <input type="text" id="studentId" name="studentId" required>

      <label for="name">Student Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="projectTitle">Project Title:</label>
      <input type="text" id="projectTitle" name="projectTitle" required>

      <label for="description">Project Description:</label>
      <textarea id="description" name="description" rows="4" required></textarea>

      <label for="category">Project Category:</label>
      <select id="category" name="category">
        <option value="web">Web Development</option>
        <option value="ai">AI / ML</option>
        <option value="iot">IoT</option>
        <option value="app">Mobile App</option>
        <option value="other">Other</option>
      </select>

      <label for="file">Upload Project File (PDF/ZIP):</label>
      <input type="file" id="file" name="file" accept=".pdf,.zip" required>

      <button type="submit">Submit Project</button>
    </form>
  </div>

  <script>
    document.getElementById('projectForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert("✅ Project submitted successfully!");
   
    });
  </script>
</body>
</html>
