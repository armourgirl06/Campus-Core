<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Attendance Calculator</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --bg-color: #f0f2f5;
      --white: #fff;
      --input-bg: #f9fafb;
      --result-bg: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 50px 20px;
      margin: 0;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .calculator {
      background: var(--white);
      padding: 30px 25px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      transition: transform 0.3s ease;
    }

    .calculator:hover {
      transform: translateY(-2px);
    }

    .calculator h2 {
      text-align: center;
      margin-bottom: 25px;
      color: var(--primary-color);
      font-size: 24px;
    }

    .calculator label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    .calculator input {
      width: 100%;
      padding: 10px;
      background: var(--input-bg);
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .calculator input:focus {
      border-color: var(--primary-color);
      outline: none;
    }

    .calculator button {
      width: 100%;
      padding: 12px;
      margin-top: 25px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .calculator button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .result {
      margin-top: 20px;
      padding: 15px 20px;
      background: var(--result-bg);
      border-left: 4px solid var(--primary-color);
      border-radius: 6px;
      color: #333;
      animation: slideFadeIn 0.5s ease-in-out;
    }

    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      .calculator {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h2>Attendance Calculator</h2>
    <label for="total">Total Classes Held</label>
    <input type="number" id="total" min="0" value="0">

    <label for="attended">Classes Attended</label>
    <input type="number" id="attended" min="0" value="0">

    <label for="required">Required %</label>
    <input type="number" id="required" min="0" max="100" value="75">

    <button onclick="calculate()">Calculate</button>

    <div id="output" class="result" style="display:none;"></div>
  </div>

  <script>
    function calculate() {
      const t = parseInt(document.getElementById('total').value, 10);
      const a = parseInt(document.getElementById('attended').value, 10);
      const reqP = parseFloat(document.getElementById('required').value) / 100;

      const out = document.getElementById('output');
      out.style.display = 'block';

      if (isNaN(t) || isNaN(a) || isNaN(reqP) || t < 0 || a < 0 || reqP < 0 || reqP > 1) {
        out.textContent = '⚠️ Please enter valid non-negative numbers.';
        return;
      }
      if (a > t) {
        out.textContent = '⚠️ Attended classes cannot exceed total classes.';
        return;
      }

      const currentP = t === 0 ? 0 : (a / t) * 100;
      let message = `📊 Your current attendance: ${currentP.toFixed(2)}%.`;

      if (currentP / 100 < reqP) {
        const needed = Math.ceil((reqP * t - a) / (1 - reqP));
        message += `\n📈 You need to attend at least ${needed} more class${needed === 1 ? '' : 'es'} to reach ${ (reqP*100).toFixed(0) }%.`;
      } else if (currentP / 100 > reqP) {
        const maxMiss = Math.floor(a / reqP - t);
        if (maxMiss > 0) {
          message += `\n🟢 You can miss up to ${maxMiss} class${maxMiss === 1 ? '' : 'es'} and still maintain ${ (reqP*100).toFixed(0) }%.`;
        } else {
          message += `\n⚠️ You’re just at the threshold—avoid missing any more classes.`;
        }
      } else {
        message += `\n✅ You’re exactly at the required ${ (reqP*100).toFixed(0) }%.`;
      }

      out.textContent = message;
    }
  </script>

</body>
</html>
