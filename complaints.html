<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Submitted Complaints</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(-45deg, #0f2027, #5a90a2, #5088a0, #0f2027);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      color: #ffffff;
      margin-bottom: 30px;
      text-align: center;
    }

    #complaintList {
      width: 90%;
      max-width: 700px;
    }

    .complaint {
      background: #ffffff;
      border-left: 6px solid #ef4444;
      padding: 18px 24px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .complaint:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
    }

    .complaint strong {
      font-size: 1.1em;
      color: #0f2027;
    }

    .complaint em {
      color: #5a90a2;
      font-style: normal;
      font-weight: bold;
    }

    .complaint p {
      margin: 10px 0;
      line-height: 1.5;
      color: #333;
    }

    .file a {
      color: #0f2027;
      font-weight: bold;
      text-decoration: none;
    }

    .file a:hover {
      color: #2196f3;
    }

    small {
      display: block;
      margin-top: 10px;
      font-size: 0.85em;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Submitted Complaints</h1>
  <div id="complaintList"></div>

  <script>
    const complaints = JSON.parse(localStorage.getItem('complaints') || '[]');
    const container = document.getElementById('complaintList');

    if (complaints.length === 0) {
      container.innerHTML = "<p style='color: white;'>No complaints found.</p>";
    } else {
      complaints.reverse().forEach(c => {
        const div = document.createElement('div');
        div.className = 'complaint';
        div.innerHTML = `
          <strong>${c.studentName} (${c.studentId})</strong><br>
          <em>${c.category}</em>
          <p>${c.message}</p>
          ${c.fileData ? `<p class="file">📎 <a href="${c.fileData}" download="${c.fileName}" target="_blank">${c.fileName}</a></p>` : ''}
          <small>Submitted on: ${c.date}</small>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
