<!DOCTYPE html>
<html>
<head>
  <title>View Timetables</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #fffff0; }
    .entry { background: #fff; padding: 10px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 4px #ccc; }
    .timestamp { font-size: 0.8em; color: gray; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>All Timetables</h2>
  <div id="fileList"></div>

  <script>
    const key = "timetableFiles";
    const list = document.getElementById("fileList");

    function loadFiles() {
      const data = JSON.parse(localStorage.getItem(key)) || [];
      list.innerHTML = '';
      data.reverse().forEach(entry => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
          <a href="${entry.url}" download="${entry.name}">${entry.name}</a>
          <div class="timestamp">${entry.time}</div>`;
        list.appendChild(div);
      });
    }

    window.onload = loadFiles;
  </script>
</body>
</html>
