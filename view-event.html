<!DOCTYPE html>
<html>
<head>
  <title>View Events</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f0fff0; }
    .entry { background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 4px #ccc; }
    .timestamp { font-size: 0.8em; color: gray; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>Upcoming Events</h2>
  <div id="eventList"></div>

  <script>
    const key = "eventEntries";
    const list = document.getElementById("eventList");

    function loadEntries() {
      const data = JSON.parse(localStorage.getItem(key)) || [];
      list.innerHTML = '';
      data.reverse().forEach(entry => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `<div>${entry.text}</div><div class="timestamp">${entry.time}</div>`;
        list.appendChild(div);
      });
    }

    window.onload = loadEntries;
  </script>
</body>
</html>
