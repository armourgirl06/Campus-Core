<!DOCTYPE html>
<html>
<head>
  <title>Upload Timetable</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input[type="file"] { margin-bottom: 10px; }
    button { padding: 10px 20px; }
    .entry { background: #eef; padding: 10px; margin-top: 10px; }
    .timestamp { font-size: 0.8em; color: gray; }
  </style>
</head>
<body>
  <h2>Upload Timetable</h2>
  <input type="file" id="fileInput" accept=".pdf,.zip" />
  <button onclick="uploadFile()">Upload</button>
  <div id="fileList"></div>

  <script>
    const key = "timetableFiles";
    const fileList = document.getElementById("fileList");

    function loadFiles() {
      const data = JSON.parse(localStorage.getItem(key)) || [];
      fileList.innerHTML = '';
      data.forEach(entry => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
          <a href="${entry.url}" download="${entry.name}">${entry.name}</a>
          <div class="timestamp">${entry.time}</div>`;
        fileList.prepend(div);
      });
    }

    function uploadFile() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) return alert("Please select a file.");
      const reader = new FileReader();

      reader.onload = function(e) {
        const blob = new Blob([e.target.result]);
        const url = URL.createObjectURL(blob);
        const time = new Date().toLocaleString();
        const entry = { name: file.name, time, url };
        const existing = JSON.parse(localStorage.getItem(key)) || [];
        existing.push(entry);
        localStorage.setItem(key, JSON.stringify(existing));
        loadFiles();
        fileInput.value = '';
      };

      reader.readAsArrayBuffer(file);
    }

    window.onload = loadFiles;
  </script>
</body>
</html>
