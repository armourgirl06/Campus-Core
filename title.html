<h1 STYLE="TEXT-ALIGN: CENTER;"> FACULTY ADMINISTRATION SIGN UP</h1>

      <option value="Techno India Kolkata">
      <option value="Techno Main Salt Lake">
      <option value="Techno India">
      <option value="Techno University">
    </datalist></p>
 <p><input type="text" id="universityName" placeholder="University Name" required></p>
  <p><input type="password" id="password" placeholder="Password" required></p>
  <p><input type="password" id="confirmPassword" placeholder="Confirm Password" required></p>
  <p><button type="submit">Sign Up</button></p>
  </form></div>
