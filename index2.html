<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Portal</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 20px;
      background: #f5f5f5;
    }
    .card {
      width: 150px;
      height: 150px;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: black;
    }
    .card img {
      width: 50px;
      height: 50px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <a class="card" href="view-notice.html">
    <img src="notice-icon.png" alt="Notice" />
    <div>Notice</div>
  </a>
  <a class="card" href="view-timetable.html">
    <img src="timetable-icon.png" alt="Timetable" />
    <div>Timetable</div>
  </a>
  <a class="card" href="view-exam.html">
    <img src="exam-icon.png" alt="Exam" />
    <div>Exam Schedule</div>
  </a>
  <a class="card" href="view-event.html">
    <img src="event-icon.png" alt="Event" />
    <div>Event</div>
  </a>
</body>
</html>
