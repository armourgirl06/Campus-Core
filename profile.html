<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --primary: #5a90a2;
      --white-glass: rgba(255,255,255,0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(-45deg, #0f2027, #5a90a2, #5088a0, #0f2027);
      background-size: 400% 400%;
      animation: bgAnimation 15s ease infinite;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    @keyframes bgAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .profile-container {
      background: var(--white-glass);
      backdrop-filter: blur(12px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.6s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .profile-container img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.3);
      object-fit: cover;
      margin-bottom: 20px;
    }

    .profile-container h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .profile-container p {
      font-size: 16px;
      color: #ddd;
      margin-bottom: 8px;
    }

    .back-btn {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      background: var(--primary);
      border-radius: 30px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: #3c6d7d;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    
    <h2 id="profileName">Student Name</h2>
    <p id="profileId">Student ID: </p>
    <p id="profileCollege">College: </p>
    <a href="community.html" class="back-btn">← Back to Dashboard</a>
  </div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem("students"));

    if (!currentUser) {
      alert("No user is logged in. Redirecting to login page...");
      window.location.href = "login.html";
    } else {
      document.getElementById("profileName").textContent = currentUser.name || "N/A";
      document.getElementById("profileId").textContent = "Student ID: " + (currentUser.studentId || "N/A");
      document.getElementById("profileCollege").textContent = "College: " + (currentUser.college || "N/A");
    }
    if (match) {
  // Store the logged-in user data
  localStorage.setItem("students", JSON.stringify(match));
  alert("Login successful! Welcome " + match.name || match.studentId);
  window.location.href = "profile.html"; // Redirect to profile page
}

  </script>
</body>
</html>
